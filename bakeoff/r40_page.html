<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>r40 · Sonnet craft vs parallel flat parts</title>
  <style>
    :root { --bg:#111317; --panel:#1a1d23; --panel2:#242932; --line:#303641; --text:#e8eaed; --muted:#9299a5; --accent:#c8a8ed; --good:#7fdb91; --warn:#e8c46a; --bad:#f18484; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 ui-sans-serif,system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:4; padding:12px 20px 10px; background:rgba(17,19,23,.96); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
    h1 { margin:0 0 7px; font-size:18px; font-weight:650; }
    h1 span { color:var(--accent); }
    .bar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    .pill,.tool,.tabs button { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:7px; padding:4px 9px; font:inherit; font-size:12px; }
    .pill { color:var(--muted); }
    .pill b { color:var(--text); }
    button { cursor:pointer; }
    .tool.on,.tabs button.on { background:#4d3c61; border-color:#8667a2; }
    main { max-width:2400px; margin:auto; padding:15px 20px 70px; }
    .note { color:var(--muted); font-size:12px; margin:5px 0 12px; }
    .board { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .row { min-width:1480px; display:grid; grid-template-columns:235px repeat(8,minmax(145px,1fr)); gap:7px; padding:9px; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .brief { padding:5px 7px; color:var(--muted); font-size:11.5px; }
    .brief b { display:block; color:var(--text); font-size:14px; margin-bottom:3px; }
    .brief .style { color:#cab4e8; }
    .brief details { margin-top:7px; }
    .brief p { white-space:pre-wrap; margin:5px 0 0; }
    .card { min-width:0; position:relative; }
    .card img,.placeholder { width:100%; aspect-ratio:1/0.9; display:block; object-fit:cover; object-position:50% 100%; border-radius:7px; background:#d8dce1; }
    .card img { cursor:zoom-in; }
    .placeholder { display:grid; place-items:center; text-align:center; padding:10px; color:var(--muted); background:var(--panel2); font-size:12px; }
    .placeholder.bad { color:var(--bad); }
    .label { font-size:11px; line-height:1.22; min-height:29px; margin:5px 2px 3px; color:var(--accent); }
    .blind .label { color:var(--text); font-size:14px; min-height:25px; }
    .chips { display:flex; flex-wrap:wrap; gap:3px; }
    .chip { padding:1px 5px; border-radius:4px; background:var(--panel2); color:var(--muted); font-size:10.5px; white-space:nowrap; }
    .chip b { color:var(--text); font-weight:600; }
    .chip.warn { color:var(--warn); }
    .chip.bad { color:var(--bad); }
    .pickbar { display:flex; gap:3px; margin-top:5px; }
    .pickbar button { flex:1; border:1px solid var(--line); border-radius:5px; background:var(--panel2); color:var(--muted); padding:3px 2px; font-size:10px; }
    .pickbar button.on { color:#132018; background:var(--good); border-color:var(--good); font-weight:700; }
    .repaired { position:absolute; top:6px; left:5px; color:#171a1e; background:var(--warn); border-radius:4px; padding:1px 5px; font-size:10px; font-weight:700; }
    .sec { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:13px 15px; margin-bottom:15px; overflow-x:auto; }
    .sec h2 { color:var(--muted); font-size:14px; font-weight:500; margin:0 0 9px; }
    table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
    th,td { padding:5px 7px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    th { color:var(--muted); font-weight:500; }
    td:first-child,th:first-child { text-align:left; }
    td.v { color:var(--accent); }
    .win { color:var(--good); }
    .grid { display:grid; gap:4px; min-width:1150px; }
    .gridhead { color:var(--muted); text-align:center; font-size:10px; padding:3px; }
    .grid img,.grid .placeholder { width:100%; aspect-ratio:1/0.9; object-fit:cover; border-radius:4px; font-size:10px; }
    .gridsub { align-self:center; color:var(--text); font-size:11px; }
    #lightbox { display:none; position:fixed; inset:0; z-index:8; place-items:center; background:rgba(0,0,0,.9); cursor:zoom-out; }
    #lightbox img { max-width:96vw; max-height:94vh; }
    kbd { border:1px solid var(--line); background:var(--panel2); padding:0 4px; border-radius:3px; }
    @media (max-width:800px) { header { padding-left:11px; padding-right:11px; } main { padding-left:10px; padding-right:10px; } }
  </style>
  <header>
    <h1><span>r40</span> · Sonnet 5.5 craft v3 vs parallel flat parts</h1>
    <div class="bar" id="status"></div>
    <div class="bar" style="margin-top:8px">
      <span class="tabs"><button data-tab="board" class="on">Builds</button> <button data-tab="numbers">Numbers</button> <button data-tab="grid">Contact grid</button></span>
      <button class="tool" id="blind">Blind</button>
      <button class="tool" id="unblind">Unblind</button>
      <button class="tool" id="export">Export picks</button>
    </div>
  </header>
  <main id="main"></main>
  <div id="lightbox"><img alt="" /></div>
  <script>
    const PICK_KEY = "r40-picks-v1", UI_KEY = "r40-ui-v1";
    let D = null;
    let picks = {};
    let ui = { tab:"board", blind:false, cur:0 };
    try { picks = JSON.parse(localStorage.getItem(PICK_KEY) || "{}"); } catch (_) { picks = {}; }
    try { ui = Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || "{}")); } catch (_) {}
    const save = () => { localStorage.setItem(PICK_KEY, JSON.stringify(picks)); localStorage.setItem(UI_KEY, JSON.stringify(ui)); };
    const esc = (s) => String(s ?? "").replace(/[&<>\"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
    const fmt = (v,d=0) => v == null ? "–" : Number(v).toLocaleString("en", {maximumFractionDigits:d});
    const k = (v) => v == null ? "–" : Number(v) >= 1000 ? (Number(v)/1000).toFixed(1)+"k" : String(v);
    const cap = (s) => s.replace(/(^|[ -])([a-z])/g, (_,a,b) => a+b.toUpperCase());
    function hash(s) { let h=2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return h >>> 0; }
    function order(row) {
      const vs = Object.keys(D.variants), seed = hash("r40:" + row.id);
      return vs.map((v,i) => ({v, n:hash(seed + ":" + v + ":" + i)})).sort((a,b) => a.n-b.n).map(x => x.v);
    }
    function chips(c) {
      if (!c || c.state === "queued" || ui.blind) return "";
      const a=[];
      if (c.wall != null) a.push(`<span class=chip>wall <b>${c.wall}s</b></span>`);
      if (c.parallel && c.planMs != null) a.push(`<span class=chip>plan <b>${fmt(c.planMs)}ms</b></span>`);
      if (c.parallel && c.slowestPartMs != null) a.push(`<span class=chip>slow part <b>${fmt(c.slowestPartMs)}ms</b></span>`);
      if (c.out != null) a.push(`<span class=chip>out <b>${k(c.out)}</b></span>`);
      if (c.think != null) a.push(`<span class=chip>think <b>${c.thinkExact ? "" : "~"}${k(c.think)}</b></span>`);
      if (c.kb != null) a.push(`<span class=chip><b>${c.kb}</b> KB</span>`);
      if (c.parts != null) a.push(`<span class=chip><b>${c.parts}</b> parts</span>`);
      if (c.tris != null) a.push(`<span class=chip><b>${k(c.tris)}</b> tris</span>`);
      if (c.typeErrors) a.push(`<span class="chip warn"><b>${c.typeErrors}</b> type err</span>`);
      if (c.cost != null) a.push(`<span class=chip>$<b>${Number(c.cost).toFixed(2)}</b></span>`);
      if (c.state !== "ok") a.push(`<span class="chip ${c.state === "crashed" || c.state === "failed" ? "bad" : "warn"}">${esc(c.state)}</span>`);
      if (c.fix) a.push(`<span class="chip ${c.fix.state === "ok" ? "warn" : "bad"}">${c.fix.state === "ok" ? "repaired" : "repair " + c.fix.state}</span>`);
      return `<div class=chips>${a.join("")}</div>`;
    }
    function picture(c) {
      if (!c || c.state === "queued") return `<div class=placeholder>queued</div>`;
      if (c.state === "ok" && c.img) return `<img src="${c.img}" data-sheet="${c.sheet || ""}" alt="">`;
      if (c.fix && c.fix.state === "ok" && c.fix.img) return `<img src="${c.fix.img}" data-sheet="${c.fix.sheet || ""}" alt="">${ui.blind ? "" : "<span class=repaired>repaired</span>"}`;
      const why = ui.blind ? "" : (c.fix && c.fix.renderError) || c.renderError || c.error || "";
      return `<div class="placeholder bad">${esc(c.state)}${why ? `<small>${esc(why).slice(0,220)}</small>` : ""}</div>`;
    }
    function pickButtons(row, vid) {
      if (!ui.blind) return "";
      const p = picks[row.id] || {}, same = Array.isArray(p.same) && p.same.includes(vid);
      return `<div class=pickbar><button data-pick="best" data-vid="${vid}" data-sub="${row.id}" class="${p.best === vid ? "on" : ""}">best</button><button data-pick="same" data-vid="${vid}" data-sub="${row.id}" class="${same ? "on" : ""}">as good</button></div>`;
    }
    function brief(row) {
      const lines=row.brief.split("\n"), subj=(lines[1] || row.id).replace(/^Subject:\s*/,""), style=(lines[2] || "").replace(/^Style:\s*/,"");
      return `<div class=brief><b>${esc(subj)}</b><span class=style>${esc(style)}</span><details><summary>brief</summary><p>${esc(row.brief)}</p></details></div>`;
    }
    function board() {
      return `<p class=note>Blind mode hides setup names and all measurements, then shuffles the eight columns independently for each brief. Pick one <b>best</b> and any number that are <b>as good</b> as best. <kbd>j</kbd>/<kbd>k</kbd> move rows; <kbd>b</kbd> toggles blind.</p><div class=board>${D.rows.map((row,i) => {
        const vs = ui.blind ? order(row) : Object.keys(D.variants), p=picks[row.id] || {};
        return `<div class="row ${ui.blind ? "blind" : ""}" data-sub="${row.id}" data-i="${i}">${brief(row)}${vs.map((vid,j) => {
          const c=row.cells[vid], label=ui.blind ? String.fromCharCode(65+j) : D.variants[vid];
          return `<div class=card>${ui.blind ? `<div class=label>${label}</div>` : `<div class=label>${esc(label)}</div>`}${picture(c)}${chips(c)}${pickButtons(row,vid)}</div>`;
        }).join("")}</div>`;
      }).join("")}</div>`;
    }
    function numbers() {
      const metrics=[["toWorking","working s",0],["wall","wall s",0],["planMs","plan ms",0],["slowestPartMs","slow part ms",0],["think","est. thinking",0],["out","output tokens",0],["tps","tokens/s",0],["kb","KB",1],["parts","parts",0],["tris","triangles",0],["tex","textures",0]];
      let h=`<div class=sec><h2>Medians across available run records. Parts and triangles use rendered, successful first attempts. Plan and slow-part medians apply to parallel arms; cost is the run-record sum.</h2><table><tr><th>column</th><th>replied</th><th>rendered</th><th>repaired/usable</th><th>crashed</th><th>type-error builds</th>${metrics.map(x=>`<th>${x[1]}</th>`).join("")}<th>$/build</th><th>cost sum</th></tr>`;
      for (const [vid,label] of Object.entries(D.variants)) { const s=D.summary[vid]; h+=`<tr><td class=v>${esc(label)}</td><td>${s.n}/${D.rows.length}</td><td>${s.ok}</td><td>${s.repaired ? s.repaired+" / " : ""}${s.usable}</td><td>${s.crashed || ""}</td><td>${s.typeErr || ""}</td>${metrics.map(([key,,d])=>`<td>${key === "think" && vid.startsWith("r35") && s[key] != null ? "~" : ""}${fmt(s[key],d)}</td>`).join("")}<td>${s.cost == null ? "–" : "$"+Number(s.cost).toFixed(2)}</td><td>${s.costSum ? "$"+s.costSum.toFixed(2) : ""}</td></tr>`; }
      h+=`</table><p class=note>Thinking is estimated from billed output for these Sonnet records. A repair is shown as the repair image when the first attempt did not render. Rendering time is not included in model wall time.</p></div>`;
      if (!ui.blind) h+=aggregate();
      return h;
    }
    function aggregate() {
      const tally={};
      for (const p of Object.values(picks)) { if (p.best) tally[p.best]=(tally[p.best]||{best:0,same:0}),tally[p.best].best++; for (const v of (p.same||[])) tally[v]=(tally[v]||{best:0,same:0}),tally[v].same++; }
      return `<div class=sec><h2>Your picks · aggregate by arm</h2><table><tr><th>column</th><th>best</th><th>as good as best</th></tr>${Object.entries(D.variants).map(([v,l])=>`<tr><td class=v>${esc(l)}</td><td>${tally[v]?.best || 0}</td><td>${tally[v]?.same || 0}</td></tr>`).join("")}</table></div>`;
    }
    function grid() {
      const vs=Object.keys(D.variants), cols=`130px repeat(${vs.length},minmax(90px,1fr))`;
      let h=`<div class=sec><h2>Contact grid · click any render for its full sheet</h2><div class=grid style="grid-template-columns:${cols}"><div></div>${vs.map(v=>`<div class=gridhead>${esc(D.variants[v])}</div>`).join("")}`;
      for (const r of D.rows) h+=`<div class=gridsub>${esc(r.id)}</div>${vs.map(v=>`<div>${picture(r.cells[v])}</div>`).join("")}`;
      return h+`</div></div>`;
    }
    function status() {
      const done=Object.values(D.summary).reduce((a,s)=>a+s.n,0), rendered=Object.values(D.summary).reduce((a,s)=>a+s.ok,0), count=Object.keys(picks).length;
      document.getElementById("status").innerHTML=`<span class=pill>updated <b>${D.updated}</b></span><span class=pill>records <b>${done}</b> · rendered <b>${rendered}</b></span><span class=pill>your picks <b>${count}/${D.rows.length}</b></span>`;
      document.getElementById("blind").classList.toggle("on",ui.blind); document.getElementById("unblind").classList.toggle("on",!ui.blind);
      document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
    }
    function render() { if (!D) return; const y=scrollY; status(); document.getElementById("main").innerHTML=ui.tab === "board" ? board() : ui.tab === "numbers" ? numbers() : grid(); scrollTo(0,y); }
    async function load() { try { const r=await fetch("data.json?"+Date.now()); const d=await r.json(); if (!D || JSON.stringify(d)!==JSON.stringify(D)) { D=d; render(); } } catch (_) {} }
    function exportPicks() {
      const payload={version:1,round:"r40",exported:new Date().toISOString(),picks};
      const text=JSON.stringify(payload,null,2), blob=new Blob([text],{type:"application/json"}), a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="r40-picks.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      navigator.clipboard?.writeText(text).catch(()=>{});
      const b=document.getElementById("export"); b.textContent="Exported"; setTimeout(()=>b.textContent="Export picks",1400);
    }
    document.addEventListener("click",(e)=>{ const t=e.target;
      if (t.dataset.tab) { ui.tab=t.dataset.tab; save(); render(); scrollTo(0,0); }
      else if (t.id === "blind") { ui.blind=true; save(); render(); }
      else if (t.id === "unblind") { ui.blind=false; save(); render(); }
      else if (t.id === "export") exportPicks();
      else if (t.dataset.pick) { const sub=t.dataset.sub, vid=t.dataset.vid, p=(picks[sub] ||= {}); if (t.dataset.pick === "best") p.best=p.best===vid ? null : vid; else { const same=p.same ||= [], i=same.indexOf(vid); i<0 ? same.push(vid) : same.splice(i,1); } if (!p.best && !(p.same||[]).length) delete picks[sub]; save(); render(); }
      else if (t.dataset.sheet) { const lb=document.getElementById("lightbox"), im=lb.querySelector("img"); im.src=ui.blind ? t.src : t.dataset.sheet; lb.style.display="grid"; }
      else if (t.closest("#lightbox")) document.getElementById("lightbox").style.display="none";
    });
    document.addEventListener("keydown",(e)=>{ if(e.key === "Escape") document.getElementById("lightbox").style.display="none"; if(ui.tab !== "board" || e.target.tagName === "INPUT") return; const rows=document.querySelectorAll(".row"); if(e.key === "j" || e.key === "k") { ui.cur=Math.max(0,Math.min(rows.length-1,ui.cur+(e.key === "j" ? 1 : -1))); save(); rows[ui.cur]?.scrollIntoView({block:"start"}); } if(e.key === "b") { ui.blind=!ui.blind; save(); render(); } });
    load(); setInterval(load,30000);
  </script>
</html>

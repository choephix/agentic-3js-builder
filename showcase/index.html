<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>samples</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside id="side">
      <header class="side-head">
        <strong>Samples</strong>
        <span id="count" class="muted"></span>
      </header>
      <div class="filter">
        <input id="filter" type="search" placeholder="Filter" spellcheck="false" autocomplete="off" />
        <kbd>/</kbd>
      </div>
      <nav id="list"></nav>
      <footer class="side-foot muted">agentic-3js-builder</footer>
    </aside>
    <div id="scrim"></div>

    <main id="main">
      <header id="bar">
        <button id="menu" class="icon" data-tip="Samples">
          <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" /></svg>
        </button>
        <div class="title">
          <h1 id="name"></h1>
          <span id="by"></span>
          <span id="desc"></span>
        </div>
        <div class="tools">
          <div class="seg">
            <button data-mode="shaded" data-tip="Sample colours · 1">Shaded</button>
            <button data-mode="bones" data-tip="Colour by bone; skinned parts blend by weight · 2">Bones</button>
            <button data-mode="groups" data-tip="Colour by part group · 3">Groups</button>
          </div>
          <button id="t-skeleton" class="tog" data-tip="Skeleton x-ray · S">Skeleton</button>
          <button id="t-wire" class="tog" data-tip="Wireframe · W">Wire</button>
          <button id="t-bend" class="tog" data-tip="Bend test · B">Bend</button>
          <span class="sep"></span>
          <button id="frame" class="icon" data-tip="Frame · F">
            <svg viewBox="0 0 16 16">
              <path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3" />
              <circle cx="8" cy="8" r="1.6" />
            </svg>
          </button>
          <button id="t-panel" class="icon tog" data-tip="Data panels · I T R C V">
            <svg viewBox="0 0 16 16">
              <rect x="2" y="2.5" width="12" height="11" rx="1.5" />
              <path d="M9.5 2.5v11" />
            </svg>
          </button>
        </div>
      </header>

      <div id="stage">
        <div id="viewport"></div>
        <div id="legend" class="float" hidden></div>
        <div id="focus-chip" class="float" hidden></div>
        <div id="tip" hidden></div>
        <div id="error" hidden></div>
        <div id="bendbar" class="float" hidden>
          <button id="wiggle" class="round">▶</button>
          <input id="bend" type="range" min="-100" max="100" value="0" data-tip="Bend amount · [ ]" />
          <output id="bend-value">rest</output>
          <span class="sep"></span>
          <label class="seed" data-tip="Random pose seed"
            >seed <input id="seed" type="number" min="1" max="9999"
          /></label>
          <button id="reseed" class="icon" data-tip="New random pose · N">
            <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" /></svg>
          </button>
          <button id="rest" class="text" data-tip="Rest pose · 0">Rest</button>
          <button id="bend-close" class="icon" data-tip="Close · B">
            <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
          </button>
        </div>
      </div>

      <footer id="status">
        <span id="stats"></span>
        <span class="spacer"></span>
        <span id="live" data-tip="Saving a sample or the SDK reloads it here">live</span>
        <button id="help-button" data-tip="Keyboard shortcuts · ?"><kbd>?</kbd></button>
      </footer>
    </main>

    <section id="panel">
      <header class="panel-head">
        <nav class="tabs">
          <button data-panel="info" data-tip="I">Info</button>
          <button data-panel="tree" data-tip="T">Tree</button>
          <button data-panel="rig" data-tip="R">Rig</button>
          <button data-panel="code" data-tip="C">Code</button>
          <button data-panel="versions" data-tip="V">Versions</button>
        </nav>
        <button id="panel-close" class="icon" data-tip="Close · Esc">
          <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
      </header>
      <div id="panel-body"></div>
    </section>

    <div id="help" hidden>
      <div class="help-card">
        <h2>Keyboard</h2>
        <div id="help-body"></div>
      </div>
    </div>
    <div id="tooltip" hidden></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

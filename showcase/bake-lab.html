<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bake lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1015;
        --panel: #141922;
        --line: #232b38;
        --fg: #e8e4dc;
        --muted: #8a93a3;
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: var(--bg);
        color: var(--fg);
      }
      #view {
        min-height: 0;
      }
      #panel {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 12px;
        max-height: 40vh;
        overflow: auto;
      }
      #panel label {
        margin-right: 12px;
        color: var(--muted);
      }
      button {
        margin-right: 6px;
      }
      body.busy button {
        opacity: 0.5;
        pointer-events: none;
      }
      #status {
        color: var(--muted);
        margin-left: 8px;
      }
      table {
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 3px 8px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <label
        >Set
        <select id="set">
          <option value="heavy">Heavy 6</option>
          <option value="world">World 43</option>
        </select></label
      >
      <label
        >Preview
        <select id="preview">
          <option value="0">none</option>
          <option value="4">1/4</option>
          <option value="2">1/2</option>
        </select></label
      >
      <label>Workers <input id="workers" type="number" min="1" max="32" style="width: 4em" /></label>
      <button id="run-sync">Sync</button><button id="run-sliced">Sliced</button><button id="run-workers">Workers</button
      ><button id="run-all">All three</button><span id="status"></span>
      <table id="results"></table>
    </div>
    <script type="module" src="./bake-lab.ts"></script>
  </body>
</html>

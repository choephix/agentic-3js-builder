<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assemble as a loading animation</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1015;
        --panel: #141922;
        --line: #232b38;
        --fg: #e8e4dc;
        --muted: #8a93a3;
        --accent: #ffcf7a;
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 220px 1fr;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow-y: auto;
        padding: 12px 8px 24px;
      }
      aside h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 6px 10px;
      }
      aside h1 span {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 11px;
      }
      aside h1 a {
        color: var(--muted);
      }
      #list a {
        display: block;
        padding: 3px 6px;
        border-radius: 6px;
        color: var(--fg);
        text-decoration: none;
      }
      #list a:hover {
        color: var(--accent);
      }
      #list a.on {
        color: var(--accent);
        font-weight: 600;
      }
      main {
        position: relative;
        overflow: hidden;
      }
      #view {
        position: absolute;
        inset: 0;
      }
      #view canvas {
        display: block;
      }
      .bar {
        position: absolute;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .group {
        display: flex;
      }
      button {
        background: #1b2230cc;
        color: var(--fg);
        border: 1px solid var(--line);
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
        border-radius: 6px;
      }
      .group button {
        border-radius: 0;
        margin-left: -1px;
      }
      .group button:first-child {
        border-radius: 6px 0 0 6px;
        margin-left: 0;
      }
      .group button:last-child {
        border-radius: 0 6px 6px 0;
      }
      button:hover {
        border-color: #3a4558;
      }
      button.on {
        background: #ffcf7a33;
        border-color: var(--accent);
        color: var(--accent);
        position: relative;
      }
      #title {
        position: absolute;
        top: 52px;
        left: 14px;
        pointer-events: none;
        text-shadow: 0 1px 6px #000;
      }
      #title b {
        font-size: 18px;
        font-weight: 600;
        display: block;
      }
      #stats {
        margin-top: 4px;
        color: var(--muted);
        font:
          11px/1.5 ui-monospace,
          monospace;
        white-space: pre;
      }
      #status {
        position: absolute;
        right: 14px;
        bottom: 12px;
        color: var(--muted);
        font:
          11px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>
        Assemble: loading version<span>hard cap, no bloom · <a href="/assemble">showpiece version</a></span>
      </h1>
      <nav id="list"></nav>
    </aside>
    <main>
      <div id="view"></div>
      <div id="title">
        <b></b>
        <div id="stats"></div>
      </div>
      <div class="bar">
        <div class="group">
          <button data-mode="single">Single</button>
          <button data-mode="world" title="Build all 43 into a grid, one after another">World</button>
        </div>
        <div
          class="group"
          title="Rise: parts grow out of their bones. Ghost: a stippled silhouette first, then rise. Pop: parts scale in. Print: one cut plane sweeps upward."
        >
          <button data-style="rise">Rise</button>
          <button data-style="ghost">Ghost</button>
          <button data-style="pop">Pop</button>
          <button data-style="print">Print</button>
        </div>
        <div class="group" title="Hard cap: every model is fully assembled this long after it is ready">
          <button data-cap="0.4">0.4 s</button>
          <button data-cap="0.8">0.8 s</button>
          <button data-cap="1.2">1.2 s</button>
        </div>
        <button id="replay" title="R or Space. In World, every model arrives again at a random moment within 2 s.">
          Replay
        </button>
      </div>
      <div id="status"></div>
    </main>
    <script type="module" src="./assemble-loading.ts"></script>
  </body>
</html>
